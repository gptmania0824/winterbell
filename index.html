<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Winter Bell</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="game">
    <canvas id="canvas" aria-label="Winter Bell game"></canvas>
    <div id="hud">
      <span>スコア <b id="score">0</b></span>
      <span>最高 <b id="best">0</b></span>
    </div>
    <section id="start" class="panel">
      <h1>Winter Bell</h1>
      <p>ウサギを左右に導き、鐘を踏んで空へ登ろう。</p>
      <p class="hint">クリック / タップ：ジャンプ開始　・　移動：マウス / 指</p>
      <p class="hint">最初の鐘に乗るまでは何度でも挑戦できます。</p>
    </section>
    <section id="gameOver" class="panel hidden">
      <h2>GAME OVER</h2>
      <p>スコア <b id="finalScore">0</b></p>
      <p class="hint">クリック / タップで最初のジャンプから再挑戦</p>
    </section>
  </main>
  <script src="game.js"></script>
</body>
</html>
